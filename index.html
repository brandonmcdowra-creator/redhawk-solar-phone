<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Redhawk Solar"/>
<meta name="theme-color" content="#0f1419"/>
<title>Redhawk Solar</title>
<style>
:root{--bg:#0f1419;--card:#1a2332;--line:#2a3a4f;--text:#e8eef6;--muted:#9aa8bc;--accent:#3b82f6;--ok:#22c55e;--warn:#f59e0b;--hot:#f97316}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:30;background:rgba(15,20,25,.95);border-bottom:1px solid var(--line);padding:.75rem 1rem}
h1{margin:0;font-size:1.08rem}.sub{color:var(--muted);font-size:.78rem;margin-top:.15rem}
nav{display:flex;gap:.35rem;padding:.55rem 1rem;position:sticky;top:62px;z-index:29;background:var(--bg)}
nav button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:.5rem .25rem;font-weight:600;font-size:.85rem}
nav button.on{background:var(--accent);border-color:var(--accent);color:#fff}
main{padding:0 1rem 4.8rem}
.tab{display:none}.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem;margin:0 0 .85rem}
.card h2{margin:0 0 .5rem;font-size:1rem}
.card h3{margin:.65rem 0 .4rem;font-size:.92rem;color:#cbd5e1}
.tog{display:flex;flex-wrap:wrap;gap:.35rem;margin:0 0 .65rem}
.tog label{font-size:.72rem;border:1px solid var(--line);border-radius:999px;padding:.32rem .55rem;background:#0f1419;display:flex;gap:.3rem;align-items:center}
svg{width:100%;height:auto;background:#0b1016;border-radius:12px;border:1px solid var(--line)}
.detail{margin-top:.65rem;padding:.7rem;border-radius:10px;background:#0f1419;border:1px solid var(--line);font-size:.86rem;min-height:3.1rem}
.badge{font-size:.65rem;padding:.12rem .4rem;border-radius:6px;margin-left:.25rem;vertical-align:middle}
.ok{background:rgba(34,197,94,.2);color:var(--ok)}.warn{background:rgba(245,158,11,.2);color:var(--warn)}
ul{margin:.2rem 0;padding-left:1.15rem}li{margin:.38rem 0}
.note{color:var(--muted);font-size:.8rem;margin:0 0 .5rem}
footer{position:fixed;left:0;right:0;bottom:0;background:rgba(15,20,25,.96);border-top:1px solid var(--line);padding:.5rem 1rem;font-size:.7rem;color:var(--muted);padding-bottom:calc(.5rem + env(safe-area-inset-bottom))}
.hot{cursor:pointer}.hot.sel{filter:brightness(1.25);stroke-width:3}
.hide{display:none !important}
.mini{display:flex;gap:.3rem;overflow-x:auto;position:sticky;top:108px;z-index:28;background:var(--bg);padding:.35rem 0 .55rem;-webkit-overflow-scrolling:touch}
.mini button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:.4rem .7rem;font-size:.75rem;font-weight:600;white-space:nowrap}
.mini button.on{background:#1e3a5f;border-color:var(--accent);color:#fff}
.wsec{display:none}.wsec.on{display:block}
.flow{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.72rem;line-height:1.55;white-space:pre;overflow-x:auto;background:#0b1016;border:1px solid var(--line);border-radius:10px;padding:.7rem;color:#a5b4c8;margin:.4rem 0}
.chk{list-style:none;padding-left:0}
.chk li{display:flex;gap:.55rem;align-items:flex-start;padding:.45rem 0;border-bottom:1px solid var(--line);font-size:.86rem}
.chk li:last-child{border-bottom:none}
.chk input{margin-top:.2rem;accent-color:var(--accent);width:1.05rem;height:1.05rem;flex-shrink:0}
.taprow{display:flex;flex-wrap:wrap;gap:.35rem;margin:.5rem 0}
.taprow button{border:1px solid var(--line);background:#0f1419;color:var(--text);border-radius:8px;padding:.4rem .55rem;font-size:.72rem}
.taprow button.sel{border-color:var(--accent);background:#1e3a5f}
</style>
</head>
<body>
<header>
  <h1>Redhawk Solar</h1>
  <div class="sub">Phone view · PASS-WITH-FIXES · GC3H <b>stackable</b></div>
</header>
<nav>
  <button class="on" type="button" data-tab="roof">Roof</button>
  <button type="button" data-tab="bay">Bay</button>
  <button type="button" data-tab="wire">Wire</button>
  <button type="button" data-tab="list">List</button>
</nav>
<main>
  <!-- CONTENT_CONTINUES_IN_NEXT_CALL -->
</main>
</body>
</html>
